name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      # The same gate a team would run on its own knowledge base.
      - run: teamkb validate examples/harbour-data-team --quiet
      - run: teamkb index examples/harbour-data-team --check
      # Evaluation questions through the local route: the stand-in must never use an
      # unpublished card; recorded open-weight model runs are replayed if committed.
      - run: teamkb eval examples/harbour-data-team evals/questions.jsonl --standin
      - name: Replay recorded local-model evaluations, if any
        run: |
          for dir in evals/recordings/*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            teamkb eval examples/harbour-data-team evals/questions.jsonl \
              --model "${name/-/:}" --recordings "$dir" --offline
          done
      - run: pip install pip-audit && pip-audit .
