[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "copilot-team-knowledge"
version = "0.2.1"
description = "A curated knowledge layer that a team keeps in SharePoint and Microsoft 365 Copilot answers from."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Flavio Mericio" }]
keywords = ["microsoft-365-copilot", "sharepoint", "knowledge-management", "declarative-agent", "rag"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Office/Business",
]
dependencies = [
    "pyyaml>=6.0",   # card headers (front matter) and kb.yaml
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
teamkb = "teamkb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/teamkb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
